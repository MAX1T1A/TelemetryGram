version: "3"

vars:
  ENV: "local"
  ENV_FILE: "env/{{.ENV}}.sh"
  COMPOSE_FILE: "docker/{{.ENV}}-docker-compose.yml"

tasks:
  migration-up:
    decs: "Запуск миграции базы данных"
    cmds:
      - source {{.ENV_FILE}} && migrate -database $POSTGRESQL_URL -path internal/db/migrations up

  migration-down:
    decs: "Откат миграции базы данных"
    cmds:
      - source {{.ENV_FILE}} && migrate -database $POSTGRESQL_URL -path internal/db/migrations down

  migration-generate:
    decs: "Генерация миграции, пример: task migration-generate name=test_migration_name"
    dir: internal/db
    vars:
      name: "{{.name}}"
    cmds:
      - migrate create -ext sql -dir migrations "{{.name}}"
  
  proto-generate:
    desc: Генерация gRPC/Protobuf кода
    cmds:
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
      - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - mkdir -p pkg/proto
      - >
        protoc --proto_path=api
        --go_out=pkg/proto/ --go_opt=paths=source_relative
        --go-grpc_out=pkg/proto/ --go-grpc_opt=paths=source_relative
        api/users/v1/users_service.proto
        api/users/v1/create_user.proto
        api/users/v1/authenticate_user.proto
    sources:
      - api/users/v1/*.proto
    generates:
      - pkg/proto/users/v1/*.pb.go


  run:
    desc: "Запуск среды. Пример: task run ENV=local"
    vars:
      ENV: "{{.ENV}}"
    cmds:
      - source {{.ENV_FILE}} && docker compose -f {{.COMPOSE_FILE}} up -d

  build:
    desc: "Запуск среды с опцией сборки. Пример: task build ENV=local"
    vars:
      ENV: "{{.ENV}}"
    cmds:
      - source {{.ENV_FILE}} && docker compose -f {{.COMPOSE_FILE}} up --build -d


  help:
    desc: "Вывод списка доступных задач"
    cmds:
      - task --list
